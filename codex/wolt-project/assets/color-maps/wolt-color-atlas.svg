#021738">Blueberry Blue</text><text x="418" y="1883" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#021738">#021738</text><text x="418" y="1916" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#021738">Малая деталь,</text><text x="418" y="1937" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#021738">опция</text><text x="830" y="1578" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#021738">Один кадр — одна выбранная схема</text><text x="830" y="1630" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#021738">Референсы задают характер, а не чужую палитру.</text><text x="830" y="1667" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#021738">В интерьере — лёгкие акценты, без квот.</text><text x="830" y="1704" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#021738">Еда, кожа и крафт сохраняют натуральный цвет.</text><text x="830" y="1741" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#021738">Логотип — только печать на пакете.</text><text x="830" y="1778" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#021738">Равные плашки не означают доли цвета в кадре.</text><text x="830" y="1815" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#021738">Это наши сочетания официальных цветов,</text><text x="830" y="1852" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#021738">а не отдельные утверждённые схемы Wolt.</text></svg>
